name: Berryroad Radar

on:
  schedule:
    - cron: "17 4 * * *"    # täglich ca. 05:17 Wiener Winterzeit: sammeln, bewerten, Alarm
    - cron: "23 5 * * 1"    # Montag ca. 06:23 Wiener Winterzeit: Wochen-Digest
  workflow_dispatch:
    inputs:
      modus:
        description: "daily oder digest"
        required: true
        default: "daily"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: modus
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modus=${{ github.event.inputs.modus }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 5 * * 1" ]; then
            echo "modus=digest" >> "$GITHUB_OUTPUT"
          else
            echo "modus=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Radar ausführen
        id: lauf
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python radar.py ${{ steps.modus.outputs.modus }}

      - name: Ergebnisse ins Repo speichern
        if: always()
        run: |
          git config user.name "berryroad-radar"
          git config user.email "radar@users.noreply.github.com"
          git add state data digests || true
          git diff --cached --quiet || git commit -m "Radar ${{ steps.modus.outputs.modus }} $(date -u +%F)"
          git push

      - name: Status melden
        if: steps.lauf.outcome == 'failure'
        run: |
          echo "::error::Radar-Lauf fehlgeschlagen. Details oben unter 'Radar ausführen' bzw. in den Annotations."
          exit 1
